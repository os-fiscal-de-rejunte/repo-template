name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- Python (roda se existir pyproject.toml) ----------
      - if: hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - if: hashFiles('pyproject.toml') != ''
        name: Install
        run: pip install -e ".[dev]"
      - if: hashFiles('pyproject.toml') != ''
        name: Lint
        run: |
          ruff check .
          ruff format --check .
      - if: hashFiles('pyproject.toml') != ''
        name: Test
        run: pytest -q

      # ---------- Node (roda se existir package.json) ----------
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('package.json') != ''
        name: Install / lint / test / build
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present
